name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ExchangeAdminWeb.slnx -c Release
      - name: Format check
        run: dotnet format ExchangeAdminWeb.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test ExchangeAdminWeb.slnx -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      # A ratchet on the security-critical paths only. Coverage had never been measured before
      # 2026-08-03 despite coverlet being a declared dependency; the suite was 1145 tests at 27.8%
      # line coverage with both mailbox-permission services at 0%. Scoped rather than global
      # because a global number is satisfied by testing whatever is easiest, which is how that
      # shape arose. See docs/TestSuiteRemediation-Plan.md.
      - name: Coverage floor (security-critical paths)
        shell: pwsh
        run: ./tools/Test-CoverageFloor.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: ASCII lint
        shell: pwsh
        run: ./tools/Test-AsciiOnly.ps1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Retried like the Pester install below, for the same cause: a transient Gallery
          # "Package failed to download" failed this step on a docs-only commit (cdt-39).
          # Imported by version after the install, because auto-loading takes the first copy on
          # PSModulePath, not the newest. 1.25.0 is the dev host's analyzer, so a local run applies
          # CI's rules; to bump it, update the dev host, this step and the CI gates Pester test.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.25.0 -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Install-Module PSScriptAnalyzer failed (attempt $attempt of 3): $($_.Exception.Message). Retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer found errors."
            exit 1
          }
      # The backup suites drive the real app binary (its db mode, docs/ConfigDbToolInApp-Plan.md),
      # so the app is built before Pester. Nothing here installs sqlite3: the scripts no longer
      # use it, and the suites must not either.
      - name: Build the app for the Pester suites
        shell: pwsh
        run: dotnet build ExchangeAdminWeb.csproj -c Release

      - name: Pester
        shell: pwsh
        run: |
          if (-not (Test-Path tests/ps)) {
            Write-Error "tests/ps is missing - the Pester invariant suite is required."
            exit 1
          }
          # Retried: a truncated Gallery download ("End of Central Directory record could not be
          # found") failed this step once with nothing wrong in the repo.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5 -SkipPublisherCheck -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Install-Module Pester failed (attempt $attempt of 3): $($_.Exception.Message). Retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $result = Invoke-Pester tests/ps -CI -PassThru

          # No suite skips by design any more. A skip that creeps back would hide exactly the
          # tests this job is here to run, so in CI a skip is a failure.
          if ($result.SkippedCount -gt 0) {
            Write-Error "$($result.SkippedCount) Pester test(s) skipped in CI. Every Pester test must run here."
            $result.Skipped | ForEach-Object { Write-Host "  skipped: $($_.ExpandedName)" }
            exit 1
          }

      # Lower-priority Wave 4 item: "exercise 5.1-compatible scripts under Windows
      # PowerShell 5.1". Every step above runs under pwsh (7.x), so Architectural Invariant
      # 6 - deploy.ps1 and the modules it imports are read by Windows PowerShell 5.1, which
      # treats a BOM-less non-ASCII file as ANSI and turns it into a parse error - was never
      # exercised anywhere. These scripts are PARSED, never run: running a deploy on a CI
      # runner is neither possible nor desirable.
      - name: Parse 5.1-critical scripts under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "Edition: $($PSVersionTable.PSEdition)  Version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "This step must run under Windows PowerShell 5.1; got $($PSVersionTable.PSVersion)."
            exit 1
          }

          $targets = @(
            'deploy.ps1',
            'tools/SqliteConfigBackup.psm1',
            'tools/JobStateWarning.psm1',
            'tools/AppPoolControl.psm1'
          )

          $failed = $false
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { Write-Error "missing: $t"; $failed = $true; continue }
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $t).Path, [ref]$null, [ref]$errors)
            if ($errors) {
              Write-Host "PARSE ERRORS in $t"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "ok: $t"
            }
          }
          if ($failed) { exit 1 }
